# Evaluation signals per catalog defect (organizer only).
#
# Static scan (static_scan.py):
#   anchors   - come from organizer/defects.yaml: regexes that match the BROKEN starter code.
#               Still matching in a team repo => the defect is probably still there.
#   fixed     - regexes that indicate a fix, searched in *.py / *.md / *.yaml of the team repo
#               (excluding data/, organizer/, tests/). Any hit is evidence of a fix.
#   gone_ok   - true when "anchor gone" alone is enough to call it fixed (code was deleted).
#   broken    - optional [file, regex] bug signatures that replace the defects.yaml anchors when
#               those anchors only locate code (e.g. `^def agent_options`) rather than the bug.
#   missing   - optional {when, absent}: broken if `when` matches somewhere in the code and
#               `absent` matches nowhere (e.g. sessions are created but never deleted).
# Write-up check (writeup_check.py):
#   writeup   - keyword groups; a defect is a candidate credit when ALL groups match in one
#               paragraph or table row (each group is a list of alternatives, case-insensitive).
#
# Calibrate after any edit:  python organizer/eval/static_scan.py --calibrate

